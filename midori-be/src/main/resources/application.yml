# Gemini API Keys (multiple keys for fallback)
ai:
  provider: ${AI_PROVIDER:gemini}
  timeout-seconds: 120
  temperature: 0.1
  max-tokens: 8192
  executor:
    core-pool-size: ${AI_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${AI_EXECUTOR_MAX_POOL_SIZE:1}
    queue-capacity: ${AI_EXECUTOR_QUEUE_CAPACITY:100}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-keys: "AQ.Ab8RN6J_uqI-pBJ-Q6KcJT6u2tW_4K5QRmS7t3DLTfSIBb8fnQ,AQ.Ab8RN6IUflU19XeySpgvsKNEND7ECfhIlewFz24CgPNVF6nGqg,AQ.Ab8RN6IMf9quTzsgDPP70RAYUdjJvvtW2FGrBkj8RXbqdXBksg,AIzaSyC4uGSSu8Ueo4n0g3ur0hNPpHxcuqJhJlw"
    model: ${GEMINI_MODEL:gemini-flash-latest}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-flash-latest,gemini-2.0-flash,gemini-2.0-flash-lite,gemini-1.5-flash,gemini-1.5-flash-8b}
    base-url: https://generativelanguage.googleapis.com
    enabled: true
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o
    base-url: https://api.openai.com/v1
    enabled: false
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    base-url: https://api.deepseek.com/v1
    enabled: false
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    models: openrouter/free
    # Fallback model(s) - tried if primary fails
    # tencent/hy3:free confirmed to produce correct UTF-8 Japanese for N5 quiz tasks
    fallback-models: google/gemini-2.5-flash
    # Per-call timeouts (ms)
    chat-timeout-ms: 15000
    quiz-timeout-ms: 25000
    connect-timeout-ms: 5000
    chat-max-tokens: 1400
    quiz-max-tokens: 4096
    referer: ${AI_OPENROUTER_REFERER:http://localhost:8081}
  pdf:
    max-file-size: 10485760
    async-threshold: 1048576
  ocr:
    enabled: true
    simulated: true
  fallback-enabled: false

# FFmpeg
ffmpeg:
  path: ${FFMPEG_PATH:}
  probe-path: ${FFPROBE_PATH:}

# Shadowing
shadowing:
  speech:
    provider: ${SHADOWING_SPEECH_PROVIDER:groq}
    profile: ${SHADOWING_SPEECH_PROFILE:balanced}
    api-timeout-seconds: ${SHADOWING_SPEECH_API_TIMEOUT_SECONDS:120}
    models:
      fast: ${SHADOWING_SPEECH_MODEL_FAST:whisper-large-v3-turbo}
      balanced: ${SHADOWING_SPEECH_MODEL_BALANCED:whisper-large-v3}
      accurate: ${SHADOWING_SPEECH_MODEL_ACCURATE:whisper-large-v3}
  evaluation:
    similarity-threshold: ${SHADOWING_SIMILARITY_THRESHOLD:0.80}
    gemini-threshold: ${SHADOWING_GEMINI_THRESHOLD:80}
    max-recording-duration-seconds: ${SHADOWING_MAX_RECORDING_SECONDS:15}
    gemini-model: ${SHADOWING_GEMINI_MODEL:gemini-2.0-flash}
    api-timeout-seconds: ${SHADOWING_API_TIMEOUT_SECONDS:120}
    cache-ttl-minutes: ${SHADOWING_CACHE_TTL_MINUTES:60}
    cache-max-size: ${SHADOWING_CACHE_MAX_SIZE:10000}
