spring:
  application:
    name: midori-be

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/midori}
    username: ${SUPABASE_DB_USERNAME:your_username_here}
    password: ${SUPABASE_DB_PASSWORD:your_password_here}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:your_jwt_secret_here_min_32_chars}
    expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.midori: debug
    org.springframework.security: debug
