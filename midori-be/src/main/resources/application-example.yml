# ============================================================
# MIDORI Backend Configuration
# ============================================================
# DO NOT commit this file with real secrets.
# Copy this file to application-local.yml and fill in real values.
# application-local.yml is already in .gitignore.
# ============================================================

spring:
  application:
    name: midori-be

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/midori}
    username: ${SUPABASE_DB_USERNAME:your_username_here}
    password: ${SUPABASE_DB_PASSWORD:your_password_here}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

app:
  admin:
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@midori.local}
    password: ${ADMIN_PASSWORD:MidoriAdmin2026!}
  jwt:
    secret: ${JWT_SECRET:your_jwt_secret_here_must_be_at_least_32_characters_long_for_hs256}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
  token:
    email-verification-expiration: ${TOKEN_EMAIL_VERIFICATION_EXPIRATION:60}
    password-reset-expiration: ${TOKEN_PASSWORD_RESET_EXPIRATION:3600}

logging:
  level:
    com.midori: debug
    org.springframework.security: debug
