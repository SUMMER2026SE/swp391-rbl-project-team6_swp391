# ============================================================
# MIDORI Local Configuration Template
# COPY THIS FILE TO application-local.yml AND FILL IN SECRETS
# DO NOT COMMIT application-local.yml
# ============================================================

spring:
  application:
    name: midori-be

  datasource:
    url: jdbc:postgresql://YOUR_SUPABASE_HOST.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: PASTE_SUPABASE_DB_PASSWORD_HERE
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: PASTE_GMAIL_SENDER_HERE
    password: PASTE_GMAIL_APP_PASSWORD_HERE
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 60000
          timeout: 60000
          writetimeout: 60000

server:
  port: 8080

app:
  admin:
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  jwt:
    secret: local-dev-jwt-secret-key-for-midori-backend-at-least-32-chars
    access-token-expiration: 86400000
  token:
    email-verification-expiration: 60
    password-reset-expiration: 3600
  google:
    client-id: YOUR_GOOGLE_CLIENT_ID
  mail:
    enabled: true
    from: PASTE_GMAIL_SENDER_HERE
  frontend:
    base-url: http://localhost:8081

logging:
  level:
    com.midori: debug
    org.springframework.security: debug
