# ============================================================
# MIDORI Local Configuration Template
# COPY THIS FILE TO application-local.yml AND FILL IN SECRETS
# DO NOT COMMIT application-local.yml
# ============================================================

spring:
  application:
    name: midori-be

  datasource:
    url: jdbc:postgresql://YOUR_SUPABASE_HOST:5432/postgres?sslmode=require
    username: YOUR_DATABASE_USERNAME
    password: YOUR_DATABASE_PASSWORD
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_GMAIL_ADDRESS
    password: YOUR_GMAIL_APP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 60000
          timeout: 60000
          writetimeout: 60000

server:
  port: 8080

app:
  jwt:
    secret: YOUR_JWT_SECRET_AT_LEAST_32_CHARS
    access-token-expiration: 86400000
  token:
    email-verification-expiration: 60
    password-reset-expiration: 3600
  google:
    client-id: YOUR_GOOGLE_CLIENT_ID
  mail:
    enabled: true
    from: YOUR_GMAIL_ADDRESS
  frontend:
    base-url: http://localhost:8081

logging:
  level:
    com.midori: debug
    org.springframework.security: debug

# ============================================================
# AI Sensei Configuration
# ============================================================
# Provider: openrouter (recommended) or gemini
# Get OpenRouter key at: https://openrouter.ai/keys
#
# IMPORTANT: When ai.fallback.enabled=false (strict AI mode),
# quiz generation returns an error instead of local fallback
# when the AI provider fails (429/quota/timeout/etc).
# ============================================================
ai:
  provider: openrouter

  # Strict AI mode: set to false to disable local quiz fallback.
  # When false, provider errors (429/quota/timeout) return an error
  # to the frontend instead of generating questions from material content.
  # Default: false (strict mode — students see real AI only).
  fallback-enabled: false

  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    # Primary model: tried first. Keep this list short.
    # Default: openrouter/free (observed to be stable in the 2026-07-07 test).
    # Avoid: deepseek/deepseek-chat-v3-0324:free (404),
    #        nvidia/nemotron-3-ultra-550b-a55b:free (ResourceExhausted / 80s hangs),
    #        openai/gpt-oss-120b:free as primary (frequent 429).
    models: >
      openrouter/free
    # Optional: at most 1 fallback. Will be tried only after primary fails.
    fallback-models: >
      openai/gpt-oss-120b:free
    # Per-call timeouts (ms). Cap read timeouts to keep UX responsive.
    chat-timeout-ms: 15000
    quiz-timeout-ms: 25000
    connect-timeout-ms: 5000
    # Cap model output length so one slow model can't burn the whole budget.
    chat-max-tokens: 1400
    quiz-max-tokens: 4096
    # Optional: custom referer header
    referer: ${AI_OPENROUTER_REFERER:http://localhost:8081}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.1-flash
