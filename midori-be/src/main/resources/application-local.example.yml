# ============================================================
# MIDORI Local Configuration Template
# COPY THIS FILE TO application-local.yml AND FILL IN SECRETS
# DO NOT COMMIT application-local.yml
# ============================================================

spring:
  application:
    name: midori-be

  datasource:
    url: jdbc:postgresql://YOUR_SUPABASE_HOST:5432/postgres?sslmode=require
    username: YOUR_DATABASE_USERNAME
    password: YOUR_DATABASE_PASSWORD
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_GMAIL_ADDRESS
    password: YOUR_GMAIL_APP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 60000
          timeout: 60000
          writetimeout: 60000

server:
  port: 8080

app:
  jwt:
    secret: YOUR_JWT_SECRET_AT_LEAST_32_CHARS
    access-token-expiration: 86400000
  token:
    email-verification-expiration: 60
    password-reset-expiration: 3600
  google:
    client-id: YOUR_GOOGLE_CLIENT_ID
  mail:
    enabled: true
    from: YOUR_GMAIL_ADDRESS
  frontend:
    base-url: http://localhost:8081
  # Admin bootstrap — auto-creates a default admin account on startup (local profile only).
  # Set bootstrap-enabled to false to disable, or change email/password for local dev.
  admin:
    bootstrap-enabled: true
    email: admin@midori.local
    password: ChangeMe123!

logging:
  level:
    com.midori: debug
    org.springframework.security: debug
