<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Kanji Practice Worksheet</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 20mm 15mm 20mm 15mm;
            @bottom-center {
                content: "Midori Japanese Platform © 2026 - Trang " counter(page);
                font-family: 'Arial', sans-serif;
                font-size: 9pt;
                color: #94a3b8;
            }
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
            background-color: #ffffff;
        }
        .worksheet-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            color: #4f46e5;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px double #cbd5e1;
            padding-bottom: 8px;
        }
        .worksheet-row {
            margin-bottom: 35px;
            page-break-inside: avoid;
            clear: both;
        }
        .row-header {
            margin-bottom: 8px;
            height: 45px;
        }
        .hanviet-title {
            float: left;
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            line-height: 45px;
            text-transform: uppercase;
            margin-right: 24px;
        }
        .stroke-order-container {
            float: left;
            padding-top: 2px;
        }
        .stroke-order-container img {
            width: 40px;
            height: 40px;
            margin-right: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            vertical-align: middle;
        }
        .meaning-line {
            font-size: 14px;
            font-weight: bold;
            color: #4b5563;
            margin-bottom: 12px;
            clear: both;
            font-style: italic;
        }
        .practice-grid {
            display: block;
            width: 620px; /* 10 * 62px = 620px */
            border: 2px solid #9CA3AF;
            background-color: #ffffff;
            margin-top: 10px;
        }
        .grid-row-div {
            display: block;
            width: 100%;
            height: 62px;
            clear: both;
        }
        .practice-box {
            position: relative;
            float: left;
            width: 61px;
            height: 62px;
            border-right: 1px solid #d9d9d9;
            border-bottom: 1px solid #d9d9d9;
            text-align: center;
            vertical-align: top;
        }
        .practice-box:last-child {
            border-right: none;
            width: 62px;
        }
        .bottom-row {
            border-bottom: none;
        }
        .cross-h {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            height: 1px;
            border-top: 1px dashed #e2e8f0;
            z-index: 1;
        }
        .cross-v {
            position: absolute;
            left: 30px;
            top: 0;
            width: 1px;
            height: 100%;
            border-left: 1px dashed #e2e8f0;
            z-index: 1;
        }
        .char-trace {
            font-family: 'Arial', 'MS Gothic', sans-serif;
            position: relative;
            font-size: 34px;
            line-height: 62px;
            font-weight: normal;
            color: #D9D9D9;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="worksheet-title">BẢNG LUYỆN VIẾT KANJI (KANJI WORKSHEET)</div>

    <div th:each="kanji : ${kanjiList}" class="worksheet-row">
        <div class="row-header">
            <div class="hanviet-title" th:text="${kanji.hanViet}"></div>
            <div class="stroke-order-container">
                <img th:each="img : ${kanji.strokeOrderImages}" th:src="${img}"/>
            </div>
        </div>

        <div class="meaning-line" th:text="${kanji.meaning}"></div>

        <div class="practice-grid">
            <!-- Row 1: 10 tracing cells -->
            <div class="grid-row-div">
                <div class="practice-box" th:each="i : ${#numbers.sequence(0, 9)}">
                    <div class="cross-h"></div>
                    <div class="cross-v"></div>
                    <span class="char-trace" th:text="${kanji.character}"></span>
                </div>
            </div>
            <!-- Row 2: 10 empty cells -->
            <div class="grid-row-div">
                <div class="practice-box bottom-row" th:each="i : ${#numbers.sequence(0, 9)}">
                    <div class="cross-h"></div>
                    <div class="cross-v"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
