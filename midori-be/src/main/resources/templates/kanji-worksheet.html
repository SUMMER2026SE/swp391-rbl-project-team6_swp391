<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Kanji Practice Worksheet</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 15mm 15mm 20mm 15mm;
            @bottom-center {
                content: "Midori Japanese Platform © 2026 - Trang " counter(page);
                font-family: 'Arial', sans-serif;
                font-size: 9pt;
                color: #94a3b8;
            }
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
            background-color: #ffffff;
        }
        .worksheet-header {
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 10px;
            margin-bottom: 25px;
            height: 45px;
            clear: both;
        }
        .header-left {
            float: left;
        }
        .title-main {
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 1px;
            line-height: 1.2;
            text-transform: uppercase;
        }
        .title-sub {
            font-size: 10px;
            color: #94a3b8;
            font-weight: bold;
        }
        .header-right {
            float: right;
            font-size: 12px;
            color: #64748b;
            line-height: 45px;
            font-weight: bold;
        }
        .worksheet-row {
            margin-bottom: 35px;
            page-break-inside: avoid;
            clear: both;
        }
        .row-header {
            margin-bottom: 8px;
            height: 45px;
        }
        .hanviet-title {
            float: left;
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
            line-height: 45px;
            text-transform: uppercase;
            margin-right: 24px;
        }
        .stroke-order-container {
            float: left;
            padding-top: 2px;
        }
        .stroke-order-container img {
            width: 40px;
            height: 40px;
            margin-right: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            vertical-align: middle;
        }
        .meaning-line {
            font-size: 14px;
            font-weight: bold;
            color: #4b5563;
            margin-bottom: 4px;
            clear: both;
        }
        .mnemonic-line {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 12px;
            clear: both;
            line-height: 1.4;
        }
        .practice-grid {
            display: block;
            width: 620px; /* 10 * 62px = 620px */
            border: 2px solid #9CA3AF;
            background-color: #ffffff;
            margin-top: 10px;
        }
        .grid-row-div {
            display: block;
            width: 100%;
            height: 62px;
            clear: both;
        }
        .practice-box {
            position: relative;
            float: left;
            width: 61px;
            height: 62px;
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
            text-align: center;
            vertical-align: top;
            box-sizing: border-box;
        }
        .practice-box:last-child {
            border-right: none;
            width: 62px;
        }
        .bottom-row {
            border-bottom: none;
        }
        .cross-h {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            height: 1px;
            border-top: 1px dashed #e2e8f0;
            z-index: 1;
        }
        .cross-v {
            position: absolute;
            left: 30px;
            top: 0;
            width: 1px;
            height: 100%;
            border-left: 1px dashed #e2e8f0;
            z-index: 1;
        }
        .char-solid {
            font-family: 'MS Gothic', 'Arial', sans-serif;
            position: relative;
            font-size: 34px;
            line-height: 62px;
            font-weight: bold;
            color: #0f172a;
            z-index: 2;
        }
        .trace-svg-wrapper {
            position: absolute;
            top: 11px;
            left: 10px;
            width: 40px;
            height: 40px;
            z-index: 2;
        }
        .trace-svg {
            width: 40px;
            height: 40px;
        }
    </style>
</head>
<body>
    <div class="worksheet-header">
        <div class="header-left">
            <div class="title-main">LUYỆN VIẾT KANJI</div>
            <div class="title-sub">midori-japanese.pages.dev</div>
        </div>
        <div class="header-right">
            <span>Họ tên: _________________</span>
            <span style="margin-left: 20px;">Ngày: ___/___/______</span>
        </div>
    </div>

    <div th:each="kanji : ${kanjiList}" class="worksheet-row">
        <div class="row-header">
            <div class="hanviet-title" th:text="${kanji.hanViet}"></div>
            <div class="stroke-order-container">
                <img th:each="img : ${kanji.strokeOrderImages}" th:src="${img}"/>
            </div>
        </div>

        <div class="meaning-line" th:text="${kanji.meaning}"></div>
        <div class="mnemonic-line" th:if="${kanji.mnemonic != null}">
            <strong>Mẹo nhớ:</strong> <span th:text="${kanji.mnemonic}"></span>
        </div>

        <div class="practice-grid">
            <!-- Row 1: 1st box solid, next 3 trace (SVG), remaining empty -->
            <div class="grid-row-div">
                <div class="practice-box" th:each="i : ${#numbers.sequence(0, 9)}"
                     th:style="${i == 0} ? 'border: 2px solid #0f172a; width: 61px; height: 62px; z-index: 10;' : ''">
                    <div class="cross-h"></div>
                    <div class="cross-v"></div>
                    <!-- Cell 1: Solid black Kanji -->
                    <span th:if="${i == 0}" class="char-solid" th:text="${kanji.character}"></span>

                </div>
            </div>
            <!-- Row 2: 10 empty cells -->
            <div class="grid-row-div">
                <div class="practice-box bottom-row" th:each="i : ${#numbers.sequence(0, 9)}">
                    <div class="cross-h"></div>
                    <div class="cross-v"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
